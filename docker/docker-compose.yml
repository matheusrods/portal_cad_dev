version: '3.8'
services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: portal-cad
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../:/var/www/html:cached
    depends_on:
      - db
    environment:
      DB_HOST: db
      DB_DATABASE: cad
      DB_USERNAME: root
      DB_PASSWORD: rootpassword
      SITE_ROOT: /var/www/html
      CHARSET: utf8mb4
  
  db:
    build:
      context: ./mysql
      dockerfile: Dockerfile.db
    container_name: portal-dbcad
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
    volumes:
      - db_data:/var/lib/mysql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-prootpassword"]
      interval: 5s
      timeout: 3s
      retries: 30

volumes:
  db_data:
