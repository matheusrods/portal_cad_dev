<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Exemplo de Pesquisa com Indicador</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <style>
        #loadingIndicator {
            display: none;
            margin-top: 20px;
        }
    </style>
</head>
<body class="container py-5">

    <h2>Pesquisa com Histórico</h2>

    <div class="input-group mb-3">
        <input type="text" class="form-control inputCampoPesquisa" placeholder="Digite sua pesquisa">
        <button class="btn btn-primary botaoCampoPesquisa">Pesquisar</button>
    </div>

    <div id="loadingIndicator" class="text-center">
        <div class="spinner-border text-primary" role="status">
            <span class="visually-hidden">Carregando...</span>
        </div>
        <p>Carregando...</p>
    </div>

    <h4>Histórico de Pesquisas:</h4>
    <ul id="historicoPesquisa" class="list-group"></ul>

    <script>
        var historicoPesquisa = [];

        function consultaTrends(texto) {
            // Simula uma requisição assíncrona com atraso
            return $.Deferred(function(defer) {
                setTimeout(function() {
                    console.log("Consulta finalizada para:", texto);
                    defer.resolve();
                }, 2000); // 2 segundos de "carregamento"
            }).promise();
        }

        $('.botaoCampoPesquisa').on('click', function () {
            var textoPesquisa = $('.inputCampoPesquisa').val().trim();

            if (textoPesquisa.length === 0) {
                alert("O campo pesquisa não pode estar vazio. Por favor, digite um texto válido.");
                return false;
            }

            if (!historicoPesquisa.includes(textoPesquisa)) {
                historicoPesquisa.push(textoPesquisa);
                $('#historicoPesquisa').append('<li class="list-group-item">' + textoPesquisa + '</li>');
            }

            $('#loadingIndicator').show();

            consultaTrends(textoPesquisa).always(function () {
                $('#loadingIndicator').hide();
                $('.inputCampoPesquisa').val('');
            });
        });
    </script>
</body>
</html>
