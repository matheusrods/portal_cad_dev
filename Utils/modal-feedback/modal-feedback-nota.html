<div id="modal-feedback-nota" class="modal hidden" data-component="feedback-nota">
    <div class="modal-content">
        <span class="close-modal">&times;</span>
        <h2 class="modal-title">Avalie o Copiloto Tom</h2>
        <p class="modal-subtitle">Em uma escala de 1 a 5, como você avalia?</p>

        <div class="stars">
            <i class="fa-solid fa-star" data-value="1"></i>
            <i class="fa-solid fa-star" data-value="2"></i>
            <i class="fa-solid fa-star" data-value="3"></i>
            <i class="fa-solid fa-star" data-value="4"></i>
            <i class="fa-solid fa-star" data-value="5"></i>
        </div>

        <label for="feedback-text-nota" class="label-feedback">
            Comentários adicionais (opcional):
        </label>
        <textarea
            id="feedback-text-nota"
            maxlength="500"
            placeholder="Compartilhe sua experiência ou sugestões"
        ></textarea>

        <div class="char-count-nota">500 caracteres restantes</div>

        <div class="modal-buttons-nota">
            <button class="btn-skip-nota">PULAR</button>
            <button class="btn-send-nota">ENVIAR AVALIAÇÃO</button>
        </div>
    </div>
</div>
